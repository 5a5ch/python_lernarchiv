<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Python-Lernarchiv</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <h1 class="site-title">Python-Lernarchiv</h1>
            <nav id="file-navigation" aria-label="Python-Übungen"></nav>
        </aside>

        <main class="workspace">
            <section class="panel input-panel">
                <div class="panel-heading">
                    <h2 id="input-title">Eingabe</h2>
                    <span id="input-file" class="status">Keine Datei ausgewählt</span>
                </div>
                <p id="input-question" class="input-question">Beim Start eines Programms erscheinen seine Fragen hier.</p>
                <form id="input-form" class="input-form" hidden>
                    <label for="python-input">Deine Antwort</label>
                    <div class="input-controls">
                        <input id="python-input" type="text" autocomplete="off">
                        <button type="submit" class="run-button">Eingabe senden</button>
                    </div>
                </form>
            </section>

            <section class="panel code-panel">
                <div class="panel-heading">
                    <h2>Python-Code</h2>
                    <span class="code-meta"><span id="code-file" class="code-file"></span><span id="load-status" class="status">Wird geladen ...</span></span>
                </div>
                <pre class="code-view"><code id="code-content">Python-Datei wird geladen ...</code></pre>
            </section>

            <section class="panel output-panel">
                <div class="panel-heading">
                    <h2>Ausgabe</h2>
                    <button id="run-button" class="run-button" type="button" disabled>Ausführen</button>
                </div>
                <pre id="output-content" class="output-view"></pre>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.2/full/pyodide.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
